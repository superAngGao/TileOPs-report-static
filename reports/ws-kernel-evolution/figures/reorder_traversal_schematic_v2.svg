<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #16202a; }
      .panel-title { font: 700 26px Arial, sans-serif; fill: #16202a; }
      .label { font: 600 19px Arial, sans-serif; fill: #2d3a45; }
      .body { font: 18px Arial, sans-serif; fill: #36424d; }
      .small { font: 700 16px Arial, sans-serif; fill: #495661; }
      .tiletext { font: 700 20px Arial, sans-serif; fill: #16202a; }
      .sched { font: 700 18px Arial, sans-serif; fill: #16202a; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5a67"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="820" fill="#fbfaf5"/>
  <text x="700" y="56" text-anchor="middle" class="title">Baseline WS Traversal vs KV-Locality Reorder</text>

  <rect x="60" y="95" width="610" height="620" rx="22" fill="#fffdf8" stroke="#d8d1c4" stroke-width="2.5"/>
  <rect x="730" y="95" width="610" height="620" rx="22" fill="#fffdf8" stroke="#d8d1c4" stroke-width="2.5"/>

  <text x="365" y="136" text-anchor="middle" class="panel-title">Baseline WS Traversal</text>
  <text x="1035" y="136" text-anchor="middle" class="panel-title">KV-Locality Reorder</text>

  <text x="110" y="184" class="label">Schedule Skeleton</text>
  <text x="780" y="184" class="label">Schedule Skeleton</text>

  <rect x="110" y="205" width="140" height="56" rx="12" fill="#dbe9f4" stroke="#8aa5ba"/>
  <rect x="268" y="205" width="140" height="56" rx="12" fill="#f4e2cf" stroke="#c5a27b"/>
  <rect x="426" y="205" width="140" height="56" rx="12" fill="#f4e2cf" stroke="#c5a27b"/>
  <text x="180" y="240" text-anchor="middle" class="sched">Producer</text>
  <text x="338" y="240" text-anchor="middle" class="sched">WG1</text>
  <text x="496" y="240" text-anchor="middle" class="sched">WG2</text>
  <line x1="250" y1="233" x2="268" y2="233" stroke="#6b7b88" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="408" y1="233" x2="426" y2="233" stroke="#6b7b88" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="780" y="205" width="140" height="56" rx="12" fill="#dbe9f4" stroke="#8aa5ba"/>
  <rect x="938" y="205" width="140" height="56" rx="12" fill="#f4e2cf" stroke="#c5a27b"/>
  <rect x="1096" y="205" width="140" height="56" rx="12" fill="#f4e2cf" stroke="#c5a27b"/>
  <text x="850" y="240" text-anchor="middle" class="sched">Producer</text>
  <text x="1008" y="240" text-anchor="middle" class="sched">WG1</text>
  <text x="1166" y="240" text-anchor="middle" class="sched">WG2</text>
  <line x1="920" y1="233" x2="938" y2="233" stroke="#6b7b88" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="1078" y1="233" x2="1096" y2="233" stroke="#6b7b88" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="110" y="316" class="label">Outer Traversal Order</text>
  <text x="780" y="316" class="label">Outer Traversal Order</text>

  <text x="110" y="348" class="small">Neighboring iterations jump across different KV working sets.</text>
  <text x="780" y="348" class="small">Neighboring iterations stay closer to one KV working set.</text>

  <!-- left tiles -->
  <rect x="110" y="382" width="88" height="72" rx="14" fill="#b8d7a8" stroke="#7aa05d" stroke-width="2"/>
  <rect x="214" y="382" width="88" height="72" rx="14" fill="#f2d39b" stroke="#bc9550" stroke-width="2"/>
  <rect x="318" y="382" width="88" height="72" rx="14" fill="#c5c9f2" stroke="#7c81bf" stroke-width="2"/>
  <rect x="422" y="382" width="88" height="72" rx="14" fill="#f0b3b3" stroke="#ba7070" stroke-width="2"/>
  <rect x="110" y="494" width="88" height="72" rx="14" fill="#b8d7a8" stroke="#7aa05d" stroke-width="2"/>
  <rect x="214" y="494" width="88" height="72" rx="14" fill="#f2d39b" stroke="#bc9550" stroke-width="2"/>
  <rect x="318" y="494" width="88" height="72" rx="14" fill="#c5c9f2" stroke="#7c81bf" stroke-width="2"/>
  <rect x="422" y="494" width="88" height="72" rx="14" fill="#f0b3b3" stroke="#ba7070" stroke-width="2"/>
  <text x="154" y="426" text-anchor="middle" class="tiletext">A1</text>
  <text x="258" y="426" text-anchor="middle" class="tiletext">B1</text>
  <text x="362" y="426" text-anchor="middle" class="tiletext">C1</text>
  <text x="466" y="426" text-anchor="middle" class="tiletext">D1</text>
  <text x="154" y="538" text-anchor="middle" class="tiletext">A2</text>
  <text x="258" y="538" text-anchor="middle" class="tiletext">B2</text>
  <text x="362" y="538" text-anchor="middle" class="tiletext">C2</text>
  <text x="466" y="538" text-anchor="middle" class="tiletext">D2</text>
  <line x1="198" y1="418" x2="214" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="302" y1="418" x2="318" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="406" y1="418" x2="422" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="466" y1="454" x2="466" y2="494" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="422" y1="530" x2="406" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="318" y1="530" x2="302" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="214" y1="530" x2="198" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <text x="110" y="625" class="body">Consecutive visits mix unrelated KV groups, so the</text>
  <text x="110" y="651" class="body">persistent loop touches a less locality-friendly stream.</text>

  <!-- right tiles -->
  <rect x="780" y="382" width="88" height="72" rx="14" fill="#b8d7a8" stroke="#7aa05d" stroke-width="2"/>
  <rect x="884" y="382" width="88" height="72" rx="14" fill="#b8d7a8" stroke="#7aa05d" stroke-width="2"/>
  <rect x="988" y="382" width="88" height="72" rx="14" fill="#f2d39b" stroke="#bc9550" stroke-width="2"/>
  <rect x="1092" y="382" width="88" height="72" rx="14" fill="#f2d39b" stroke="#bc9550" stroke-width="2"/>
  <rect x="780" y="494" width="88" height="72" rx="14" fill="#c5c9f2" stroke="#7c81bf" stroke-width="2"/>
  <rect x="884" y="494" width="88" height="72" rx="14" fill="#c5c9f2" stroke="#7c81bf" stroke-width="2"/>
  <rect x="988" y="494" width="88" height="72" rx="14" fill="#f0b3b3" stroke="#ba7070" stroke-width="2"/>
  <rect x="1092" y="494" width="88" height="72" rx="14" fill="#f0b3b3" stroke="#ba7070" stroke-width="2"/>
  <text x="824" y="426" text-anchor="middle" class="tiletext">A1</text>
  <text x="928" y="426" text-anchor="middle" class="tiletext">A2</text>
  <text x="1032" y="426" text-anchor="middle" class="tiletext">B1</text>
  <text x="1136" y="426" text-anchor="middle" class="tiletext">B2</text>
  <text x="824" y="538" text-anchor="middle" class="tiletext">C1</text>
  <text x="928" y="538" text-anchor="middle" class="tiletext">C2</text>
  <text x="1032" y="538" text-anchor="middle" class="tiletext">D1</text>
  <text x="1136" y="538" text-anchor="middle" class="tiletext">D2</text>
  <line x1="868" y1="418" x2="884" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="972" y1="418" x2="988" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="1076" y1="418" x2="1092" y2="418" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="1136" y1="454" x2="1136" y2="494" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="1092" y1="530" x2="1076" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="988" y1="530" x2="972" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <line x1="884" y1="530" x2="868" y2="530" stroke="#4a5a67" stroke-width="3.2" marker-end="url(#arrow)"/>
  <text x="780" y="625" class="body">Consecutive visits stay closer to the same KV group,</text>
  <text x="780" y="651" class="body">reducing L2 lookups and reshaping overall read traffic.</text>

  <rect x="90" y="748" width="1220" height="54" rx="14" fill="#f2eee5" stroke="#d8d1c4" stroke-width="1.5"/>
  <text x="120" y="781" class="small">Colored tiles denote different KV working sets. The producer / WG1 / WG2 skeleton is unchanged in both panels.</text>
</svg>
